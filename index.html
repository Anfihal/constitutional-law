<body>
  <div class="container">
    <h1>Карточки для запоминания по конституционному праву РФ</h1>
    <!-- Карточки будут вставлены сюда -->
  </div>

  <script>
    const data = [
      { q: "1. Понятие конституционного права России как отрасли права.", a: "Ведущая отрасль национального права, регулирующая основы конституционного строя, правовой статус личности, федеративное устройство, систему госвласти и МСУ. Предмет — фундаментальные общественные отношения." },
      { q: "2. Конституционно-правовые отношения и их субъекты.", a: "Общественные отношения, урегулированные нормами КП. Субъекты: народ РФ, государство (РФ и субъекты), госорганы, МСУ, граждане, иностранцы, лица без гражданства, общественные объединения." },
      { q: "3. Нормы конституционного права: классификация.", a: "По функции: учредительные, регулятивные, охранительные. По характеру: материальные и процессуальные. По методу: управомочивающие, обязывающие, запрещающие. По силе: Конституция, ФКЗ, ФЗ и др." },
      { q: "4. Конституционно-правовая ответственность: понятие, особенности, виды.", a: "Особый вид юридической ответственности за нарушение норм КП. Особенности: политико-правовой характер, специфические санкции. Виды: импичмент Президента, федеральное вмешательство, ликвидация объединений, избирательные нарушения." },
      { q: "5. Источники конституционного права: система и иерархия.", a: "1. Конституция РФ; 2. ФКЗ; 3. ФЗ; 4. Акты Конституционного Собрания; 5. Федеративный договор; 6. Акты Президента и Правительства; 7. Конституции/уставы субъектов; 8. Муниципальные акты. Решения КС РФ — обязательны." },
      { q: "6. Международное право и решения надгосударственных органов как источники КП после 2020 г.", a: "МП — часть правовой системы (ч.4 ст.15). Но приоритет Конституции РФ (ст.79). Решения межгосударственных органов, противоречащие Конституции, не исполняются. Окончательный арбитр — КС РФ." },
      { q: "7. Конституция РФ 1993 г.: характеристика, функции, свойства.", a: "Принята 12.12.1993. Смешанная республика, асимметричная федерация, естественные права человека. Свойства: верховенство, высшая сила, прямое действие, жёсткость. Функции: учредительная, организаторская, регулятивная и др." },
      { q: "8. Структура Конституции РФ. Верховенство и прямое действие.", a: "Преамбула, Раздел I (гл.1–9), Раздел II. Верховенство: высшая юр. сила на всей территории (ст.4). Прямое действие: суды применяют нормы Конституции напрямую (ч.1 ст.15)." },
      { q: "9. Порядок пересмотра Конституции РФ. Конституционное Собрание.", a: "Инициатива — 3/5 голосов СФ и ГД → созыв КС. Может подтвердить Конституцию или разработать новую (2/3 голосов или референдум). ФКЗ «О КС» до сих пор не принят." },
      { q: "10. Порядок принятия поправок к Конституции (гл.3–8). Поправки 2008 и 2014 гг.", a: "Одобрение 2/3 ГД + 3/4 СФ → одобрение 2/3 субъектов → подпись Президентом. 2008: увеличение сроков Президента и ГД. 2014: объединение ВС и ВАС, участие Президента в формировании судей." },
      { q: "11. Поправки 2020 г.: содержание и особенности процедуры.", a: "«Обнуление» президентских сроков, Госсовет, соцгарантии, приоритет Конституции над МП, защита суверенитета, упоминание Бога, брак как союз мужчины и женщины. Процедура — единый закон; КС признал допустимость. Голосование — консультативное." },
      { q: "12. Понятие и принципы конституционного строя РФ.", a: "Система политических, экономических, социальных и правовых отношений по Конституции. Принципы: народовластие, федерализм, правовое и социальное государство, светскость, республиканская форма, приоритет прав, разделение властей и др." },
      { q: "13. Характеристики РФ по Конституции 1993 г.", a: "Демократическое, федеративное, правовое, социальное, светское государство с республиканской формой правления. Суверенитет принадлежит многонациональному народу." },
      { q: "14. Россия как социальное государство. Новеллы 2020 г.", a: "Политика направлена на достойную жизнь и свободное развитие. Новеллы: социальное партнерство, социальная солидарность, индексация пенсий, МРОТ ≥ прожиточному минимуму." },
      { q: "15. Власть в РФ: формы и категория публичной власти.", a: "Народ — носитель власти. Формы: непосредственная (референдум, выборы) и представительная (через органы). Публичная власть (новелла 2020) — объединяет госвласть и МСУ в единую систему при сохранении самостоятельности МСУ." },
      { q: "16. Непосредственная демократия: императивные и консультативные институты.", a: "Императивные: референдум, выборы, отзыв — имеют юридическую силу. Консультативные: слушания, инициативы, опросы — мнение учитывается, но не обязательно к исполнению." },
      { q: "17. Референдум РФ: порядок и последствия.", a: "Регулируется ФКЗ №5-ФКЗ. Инициатива — 2 млн подписей или органы власти. Решение принимается, если за него проголосовало >50% участников при явке >50%. Решение общеобязательно и действует прямо." },
      { q: "18. Отзыв депутата: проблема и позиция КС РФ.", a: "Не предусмотрен на федеральном уровне. На региональном/местном — возможно по законам субъектов. КС РФ требует конкретных оснований и защиты от политических репрессий." },
      { q: "19. Консультативные институты демократии.", a: "Народные обсуждения, опросы, правотворческая инициатива, петиции. Позволяют учесть мнение граждан, но не обязывают к принятию решений." },
      { q: "20. Политический плюрализм и идеологическое многообразие.", a: "Ст.13: признаются многопартийность, идеологическое и политическое многообразие. Запрещены объединения, направленные на насильственное изменение строя, разжигание розни и др." },
      { q: "21. Общественная палата РФ.", a: "Совещательный орган для взаимодействия граждан и государства. Формируется из представителей НКО. Заключения — рекомендательные. Аналоги есть в субъектах РФ." },
      { q: "22. Общественный контроль в РФ.", a: "Регулируется ФЗ №212-ФЗ. Субъекты: палаты, советы, НКО. Формы: мониторинг, экспертиза, обсуждения. Результаты подлежат обязательному рассмотрению органами власти." },
      { q: "23. Общественные объединения: понятие, формы, регистрация.", a: "Добровольные некоммерческие формирования. Формы: организация, движение, фонд, орган самодеятельности. Регистрация в Минюсте — добровольна, но нужна для статуса ЮЛ." },
      { q: "24. Политические партии: предназначение и требования.", a: "Созданы для участия в политической жизни, выборах, представлении интересов. Требования: ≥500 членов, отделения в >½ субъектов. Запрещены партии по нац./религ. признаку." },
      { q: "25. Принципы конституционного статуса личности.", a: "Неотчуждаемость, непосредственное действие, равноправие, гарантированность государством, соответствие МП, запрет злоупотребления и ограничения только законом в конституционных целях." },
      { q: "26. Права и свободы по Конституции: система и свойства.", a: "Свойства: высшая сила, непосредственное действие. Система: личные, политические, социально-экономические, культурные. Сочетают естественные и позитивные права." },
      { q: "27. Гражданство РФ: характеристики.", a: "Единое и равное, нельзя лишить, нельзя выслать или выдать. Допускается двойное гражданство. Поощряется приобретение лицами без гражданства." },
      { q: "28. Приобретение гражданства РФ (ФЗ №138-ФЗ, 2023).", a: "По рождению, в общем порядке (5 лет ВНЖ, отказ от другого гражданства и др.), в упрощённом (супруги, дети, бывшие граждане СССР), восстановление, оптация." },
      { q: "29. Прекращение гражданства РФ.", a: "Выход по заявлению (если нет обязательств перед РФ), отмена решения о приёме (при подлоге), оптация. Решение — Президент или МВД." },
      { q: "30. Положение иностранцев и апатридов в РФ.", a: "Права и обязанности — наравне с гражданами, кроме изъятий: нельзя избирать, занимать госдолжности, служить в армии. Ограничения должны быть соразмерны целям." },
      { q: "31. Личные права граждан РФ.", a: "Право на жизнь, достоинство, свободу, неприкосновенность, частную жизнь, тайну переписки, неприкосновенность жилища, язык, свобода передвижения, совести и вероисповедания." },
      { q: "32. Свобода совести и светский характер государства.", a: "Гарантируется право исповедовать любую религию или не исповедовать. Религия отделена от государства. Преамбула 2020: «вера в Бога» — культурно-историческая констатация, не меняет светский характер." },
      { q: "33. Политические права граждан РФ.", a: "Свобода мысли и слова, информация, объединение, собрания, участие в управлении (выборы, госслужба, правосудие), обращения в органы власти." },
      { q: "34. Социально-экономические права. Новеллы 2020 г.", a: "Право на труд, собственность, жилище, здоровье, благоприятную среду. Новеллы: индексация пенсий, МРОТ ≥ ПМ, обязательное соцстрахование, адресная поддержка." },
      { q: "35. Права по защите других прав.", a: "Судебная защита, международная защита, возмещение вреда, квалифицированная юрпомощь, презумпция невиновности, право не свидетельствовать против себя и близких." },
      { q: "36. Конституционные обязанности граждан РФ.", a: "Соблюдать Конституцию и законы, платить налоги, беречь природу, защищать Отечество, заботиться о детях и родителях, обеспечивать образование детям, беречь наследие." },
      { q: "37. Уполномоченный по правам человека в РФ.", a: "Назначается ГД, не входит в систему властей. Рассматривает жалобы, даёт заключения, обращается в суды. Есть аналоги в субъектах и специализированные (по детям, предпринимателям)." },
      { q: "38. Модель российского федерализма.", a: "Конституционная, асимметричная, кооперативная федерация. Тенденция к централизации. Федеральные округа — инструмент президентского контроля." },
      { q: "39. Принципы федеративного устройства и суверенитет РФ.", a: "Целостность, единство госвласти, разграничение полномочий, равноправие субъектов и народов. Суверенитет РФ неделим, распространяется на всю территорию, РФ — субъект МП." },
      { q: "40. Основные черты РФ как государства.", a: "Демократическое, федеративное, правовое, социальное, светское, республиканское, суверенное. Суверенитет принадлежит многонациональному народу." },
      { q: "41. Состав РФ и порядок его изменения.", a: "89 субъектов (2024). Изменение: принятие нового субъекта или образование — по взаимному согласию и одобрению ФС. Регулируется ФКЗ №6-ФКЗ." },
      { q: "42. Виды и статус субъектов РФ.", a: "Республики, края, области, города фед. значения, автономная область, автономные округа. Равноправны, но республики могут иметь конституцию и гос. языки." },
      { q: "43. Разграничение предметов ведения между РФ и субъектами.", a: "Исключительное ведение РФ (ст.71), совместное (ст.72), ведение субъектов — всё остальное (ст.73). Споры о компетенции разрешает КС РФ." },
      { q: "44. Формы взаимодействия РФ и субъектов. Федеральное вмешательство.", a: "Через СФ, договоры, соглашения, целевые программы. Федеральное вмешательство: приостановление актов, роспуск парламента, отрешение главы, фин. администрация." },
      { q: "45. Федеральные округа и полпреды Президента.", a: "Административно-территориальные структуры для контроля. Полпред: координирует федеральные органы, обеспечивает реализацию полномочий Президента, представляет доклады." },
      { q: "46. Республика, край, область, город фед. значения.", a: "Республика — государство с конституцией и языками. Край, область, город — устав, не государства. Все равноправны по ст.5 К РФ." },
      { q: "47. Территориальная автономия: АО и АО. Сложносоставные субъекты.", a: "АО и АО — нац.-терр. образования для коренных народов. Проблема: АО входят в состав других субъектов (кроме Чукотского). КС РФ: они — равноправные субъекты РФ." },
      { q: "48. Национально-культурная автономия.", a: "Форма самоопределения этнических общностей. Не территориальная. Цель — сохранение культуры, языка. Регулируется ФЗ №74-ФЗ." },
      { q: "49. Административно-территориальное устройство субъектов.", a: "Деление на районы, города и др. для управления и МСУ. Регулируется законами субъектов. Относится к их ведению." },
      { q: "50. Федеральная территория — новелла 2020 г.", a: "Территория в ведении РФ, управляемая федеральными органами. Может создаваться МСУ. Цель — общегосударственные задачи. Пример: «Сириус» (ФЗ №437-ФЗ)." },
      { q: "51. Принципы избирательного права РФ.", a: "Всеобщее, равное, прямое, тайное, свободное, обязательное и периодическое, гласное." },
      { q: "52. Источники избирательного права.", a: "Конституция, ФЗ (№67, №19, №20, №95), законы субъектов, акты комиссий, решения КС РФ." },
      { q: "53. Избирательные системы в РФ.", a: "Президент — мажоритарная абсолютного большинства. ГД — смешанная (225 по спискам с 5% барьером, 225 по одномандатным округам). В субъектах и МСУ — по усмотрению законодателя." },
      { q: "54. Всеобщее избирательное право и ограничения.", a: "Активное — с 18 лет. Ограничения: недееспособность, лишение свободы. Пассивное: запрет при наличии второго гражданства, судимости, определённых должностях." },
      { q: "55. Обеспечение равного, прямого, свободного и тайного голосования.", a: "Равные округа, один голос — один вес. Прямое — за кандидата. Свобода — без принуждения. Тайна — кабины, анонимные бюллетени, запрет фото/видео." },
      { q: "56. Избирательные комиссии: виды и полномочия ЦИК.", a: "ЦИК, комиссии субъектов, окружные, территориальные, участковые. ЦИК: руководит системой, регистрирует кандидатов, устанавливает итоги, издаёт инструкции." },
      { q: "57. Выборы депутатов ГД: особенности.", a: "Два бюллетеня. По одномандатным округам — мажоритарная относительного большинства. По спискам — пропорциональная с 5% барьером." },
      { q: "58. Выборы Президента РФ: особенности.", a: "Выдвижение: партиями или самовыдвижением (300 тыс. подписей). Избирается, набрав >50% голосов. При отсутствии — второй тур по двум лидерам." },
      { q: "59. Информационное обеспечение и агитация.", a: "Информирование — нейтральное. Агитация — в установленный срок, запрещена в день тишины и голосования, органам власти, воинским частям. Расходы — из избирательных фондов." },
      { q: "60. Финансирование выборов.", a: "Государственное — на организацию, возмещение затрат успешным кандидатам. Частное — избирательные фонды (собственные средства, пожертвования с ограничениями). Строгая отчётность." },
      { q: "61. Порядок голосования и новые технологии.", a: "Явка с паспортом, тайное заполнение, опускание в ящик. Новые средства: КОИБ, КЭГ, видеонаблюдение. Электронное голосование — через госуслуги. Единый день — второе воскресенье сентября. Многодневное — 3 дня." },
      { q: "62. Ответственность за нарушение избирательного законодательства.", a: "Уголовная (фальсификация, воспрепятствование), административная (агитация, финансирование), конституционно-правовая (отмена регистрации, признание выборов недействительными)." },
      { q: "63. Система органов госвласти и модель разделения властей.", a: "Федеральный уровень: Президент, ФС, Правительство, суды. Субъекты: законодательные, исполнительные, судебные органы. Модель: сильный Президент, гарант согласованности ветвей." },
      { q: "64. Модель президентства и статус Президента (с учётом 2020 г.).", a: "Сильный президент в смешанной республике. Глава государства, гарант Конституции. Срок — 6 лет. Новеллы: «обнуление» сроков, 25 лет проживания в РФ, запрет второго гражданства." },
      { q: "65. Полномочия Президента РФ. Новеллы 2020 г.", a: "Назначение Правительства, роспуск ГД, вето, внешняя политика, назначение судей, чрезвычайные полномочия. Новеллы: усиление роли в судебной системе, право председательствовать в Правительстве, формировать Госсовет." },
      { q: "66. Акты Президента РФ.", a: "Указы — нормативные, распоряжения — индивидуальные. Обязательны на всей территории, но не должны противоречить Конституции и законам." },
      { q: "67. Прекращение полномочий Президента и гарантии.", a: "Истечение срока, отставка, болезнь, импичмент. Гарантии (новелла 2020): неприкосновенность, невозможность привлечения за действия в период полномочий (кроме госизмены по решению СФ)." },
      { q: "68. Администрация Президента РФ.", a: "Орган обеспечения деятельности Президента. Не входит в исполнительную власть. Функции: организационная, аналитическая, информационная, кадровая поддержка." },
      { q: "69. Советы при Президенте. Госсовет и Совбез.", a: "Советы и комиссии — совещательные. Госсовет — обсуждение стратегии развития (статус повышен в 2020). Совбез — подготовка решений по безопасности, возглавляется Президентом." },
      { q: "70. Модель парламентаризма и структура ФС.", a: "Ограниченный парламентаризм из-за сильного Президента. ФС — двухпалатный: СФ (регионы) и ГД (население)." },
      { q: "71. Совет Федерации: статус, формирование, полномочия.", a: "Палата регионов. По 2 представителя от субъекта (законодательный и исполнительный органы). Полномочия: утверждение границ, ЧП/ВП, отрешение Президента, назначение судей, Генпрокурора." },
      { q: "72. Государственная Дума: статус и полномочия.", a: "Нижняя палата, избирается населением. Полномочия: согласие на Председателя Правительства, доверие Правительству, назначение ЦБ, Счётной палаты, Уполномоченного, амнистия, обвинение Президента." },
      { q: "73. Взаимоотношения палат ФС.", a: "Законы принимаются ГД → рассматриваются СФ. Вето СФ преодолевается 2/3 ГД. ФКЗ — 3/4 СФ. Создаются согласительные комиссии." },
      { q: "74. Внутренняя структура и работа СФ.", a: "Председатель, Совет палаты, комитеты, комиссии. Регламент — Постановление №33-СФ. Заседания — не реже 2 раз в месяц. Решения — большинством голосов." },
      { q: "75. Внутренняя структура и работа ГД.", a: "Председатель, Совет ГД, фракции, комитеты, комиссии. Регламент — Постановление №2134-II ГД. Сессии — осенняя и весенняя. Заседания — еженедельно." },
      { q: "76. Фракции в ГД.", a: "Депутатские объединения по партийной принадлежности. Имеют право на пропорциональное представительство в органах и комитетах, выдвигают кандидатуры на руководящие должности." },
      { q: "77. Комитеты и комиссии СФ.", a: "Комитеты — постоянные (по законодательству, бюджету и др.). Комиссии — постоянные и временные. Формируются с учётом представительства от субъектов." },
      { q: "78. Комитеты и комиссии ГД.", a: "Комитеты — основные рабочие органы (по законодательству, бюджету и др.). Комиссии — для конкретных задач (Счётная, по этике). Состав — с учётом фракций." },
      { q: "79. Парламентский контроль и расследование.", a: "Формы: правительственный час, запросы, слушания, отчёты, Счётная палата. Расследование — для ЧС и грубых нарушений, результаты — рекомендательные." },
      { q: "80. Законодательный процесс: стадии и субъекты инициативы.", a: "Стадии: инициатива → 3 чтения в ГД → рассмотрение в СФ → подписание Президентом → опубликование. Субъекты: Президент, СФ, депутаты ГД, Правительство, субъекты, КС, ВС." },
      { q: "81. Согласительные процедуры и вето Президента.", a: "При отклонении СФ — согласительная комиссия. Вето Президента преодолевается 2/3 голосов в каждой палате. Не распространяется на поправки к Конституции." },
      { q: "82. Опубликование и вступление в силу ФЗ.", a: "Опубликование в «РГ», «СЗ РФ», pravo.gov.ru в течение 7 дней. Вступает в силу через 10 дней, если иное не указано. Неопубликованные законы не применяются." },
      { q: "83. Статус депутата ГД.", a: "Неприкосновенность: без согласия ГД — нельзя привлечь к ответственности, задержать. Права: инициатива, запрос. Обязанности: работать постоянно. Гарантии: зарплата, жильё, медобеспечение." },
      { q: "84. Статус сенатора РФ.", a: "Аналогичен депутату, но согласие на привлечение к ответственности даёт Комиссия СФ. Представляет интересы субъекта РФ." },
      { q: "85. Правительство РФ: статус, полномочия, взаимоотношения с Президентом.", a: "Высший исполнительный орган. Полномочия: бюджет, политика, собственность, оборона, безопасность. Президент назначает руководство, может председательствовать на заседаниях, отправить в отставку." },
      { q: "86. Федеральные органы исполнительной власти.", a: "Министерства (политика), службы (контроль), агентства (услуги, имущество). Руководители назначаются Правительством (кроме подведомственных Президенту)." },
      { q: "87. Конституционный Суд РФ: природа и место в системе властей.", a: "Судебный орган конституционного контроля. «Суд над властью»: проверяет акты всех ветвей, разрешает споры о компетенции. Его позиции обязательны." },
      { q: "88. Компетенция КС РФ (с учётом новелл 2020 г.).", a: "Проверка соответствия Конституции актов, споры о компетенции, жалобы граждан, толкование Конституции, заключение по импичменту. Новеллы: проверка законов субъектов до обнародования, вопросы МП." },
      { q: "89. Судья КС РФ: статус, назначение, прекращение полномочий.", a: "19 судей, назначаются СФ по представлению Президента. Требования: ≥40 лет, 15 лет стажа, высокая квалификация. Полномочия — 15 лет или до 70 лет." },
      { q: "90. Организация работы КС РФ.", a: "Работает в пленуме или палатах (10 и 9 судей). Руководство: Председатель, зам, секретарь — избираются судьями. Аппарат — научно-аналитическое обеспечение." },
      { q: "91. Конституционное судопроизводство: стадии.", a: "Обращение → предварительное рассмотрение → принятие к производству → подготовка → разбирательство → совещание → решение → опубликование → исполнение." },
      { q: "92. Решения КС РФ и их исполнение.", a: "Постановления, заключения, определения. Окончательны, вступают в силу немедленно, обязательны для всех. Признанные неконституционными акты утрачивают силу." },
      { q: "93. Органы законодательной власти субъектов РФ (ФЗ №414-ФЗ).", a: "Высшие и единственные законодательные органы. Избираются на 5 лет. Полномочия: устав, законы, бюджет, налоги, контроль, участие в СФ." },
      { q: "94. Органы исполнительной власти субъектов РФ (ФЗ №414-ФЗ).", a: "Высший орган (правительство/администрация) и иные (министерства и др.). Глава избирается населением или законодательным органом по представлению Президента." },
      { q: "95. Конституционное (уставное) правосудие в субъектах РФ.", a: "Создание необязательно. Проверяют соответствие законов субъекта его уставу. Действуют лишь в нескольких субъектах (Башкортостан, Чечня, Свердловская обл.)." },
      { q: "96. Конституционные основы МСУ и новеллы 2020–2025 гг.", a: "МСУ — самостоятельное решение вопросов местного значения. Новелла 2020: МСУ входит в «единую систему публичной власти». ФЗ №33-ФЗ (2025) усиливает взаимодействие с госорганами и унифицирует МСУ." }
    ];

    const container = document.querySelector('.container');
    data.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-header">${item.q}</div>
        <div class="card-body">${item.a}</div>
      `;
      card.addEventListener('click', () => card.classList.toggle('active'));
      container.appendChild(card);
    });
  </script>
